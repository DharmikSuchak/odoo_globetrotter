version: "3.9"

networks:
  globetrotter:
    driver: bridge

volumes:
  postgres_data:
  node_modules_server:
  node_modules_client:

services:
  postgres:
    image: postgres:15-alpine
    container_name: globetrotter_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-globetrotter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-globetrotter123}
      POSTGRES_DB: ${DB_NAME:-globetrotter_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - globetrotter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-globetrotter} -d ${DB_NAME:-globetrotter_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: globetrotter_redis
    ports:
      - "6379:6379"
    networks:
      - globetrotter
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: globetrotter_server
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - node_modules_server:/app/node_modules
    networks:
      - globetrotter
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: globetrotter_client
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - node_modules_client:/app/node_modules
    networks:
      - globetrotter
    depends_on:
      - server
    restart: unless-stopped
